name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "screenshots/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SALAM_VERSION: "0.7.1"
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pick.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            number=${GITHUB_REF_NAME#v}
          else
            number=$(sed -n 's/^version = "\(.*\)"/\1/p' salam.toml)
          fi
          echo "$number" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "Tags must look like v1.2.3" >&2; exit 1; }
          echo "number=$number" >>"$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev libx11-dev fonts-dejavu-core
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" linux-x86_64
      - run: sh tools/test.sh

  macos:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.number }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" macos-${{ matrix.arch }}
      - run: sh build.sh macos
      - run: sh tools/smoke.sh "dist/macos/Salam Calculator.app/Contents/MacOS/salam-calculator"
      - name: Collect the packages
        run: |
          mkdir -p "package/package-macos-${{ matrix.arch }}"
          mv dist/*.dmg "package/package-macos-${{ matrix.arch }}/"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-macos-${{ matrix.arch }}
          key: package-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Keep a download of the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: package-macos-${{ matrix.arch }}
          path: package/package-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev libx11-dev fonts-dejavu-core
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" linux-${{ matrix.arch }}
      - run: sh build.sh linux
      - run: sh tools/smoke.sh dist/linux/salam-calculator/salam-calculator
      - name: Collect the packages
        run: |
          mkdir -p "package/package-linux-${{ matrix.arch }}"
          mv dist/*.tar.gz dist/*.deb "package/package-linux-${{ matrix.arch }}/"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-linux-${{ matrix.arch }}
          key: package-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Keep a download of the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: package-linux-${{ matrix.arch }}
          path: package/package-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" linux-x86_64
      - run: sh build.sh windows
      - name: Collect the packages
        run: |
          mkdir -p "package/package-windows-x86_64"
          mv dist/*.zip "package/package-windows-x86_64/"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-windows-x86_64
          key: package-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Keep a download of the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: package-windows-x86_64
          path: package/package-windows-x86_64
          if-no-files-found: error
          retention-days: 3

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-windows-x86_64
          key: package-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - shell: bash
        run: |
          unzip -q package/package-windows-x86_64/*.zip -d unpacked
          sh tools/smoke.sh "unpacked/Salam Calculator/salam-calculator.exe"

  android:
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SALAM_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SALAM_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" linux-x86_64
      - name: Load the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"
      - run: sh build.sh android
      - name: Collect the packages
        run: |
          mkdir -p "package/package-android"
          mv dist/*.apk "package/package-android/"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-android
          key: package-android-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Keep a download of the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: package-android
          path: package/package-android
          if-no-files-found: error
          retention-days: 3

  ios:
    needs: [version, test]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tools/setup-salam.sh "$RUNNER_TEMP/salam" macos-arm64
      - run: sh build.sh ios
      - name: Start the app in a simulator
        run: sh tools/ios-smoke.sh dist/ios-simulator/App.app dist/ios-screen.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: screen-ios
          path: dist/ios-screen.png
          retention-days: 3
      - name: Collect the packages
        run: |
          mkdir -p "package/package-ios"
          mv dist/*-ios-simulator.zip dist/*-ios-unsigned.ipa "package/package-ios/"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-ios
          key: package-ios-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Keep a download of the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: package-ios
          path: package/package-ios
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows, windows-check, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-macos-arm64
          key: package-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-macos-x86_64
          key: package-macos-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-linux-x86_64
          key: package-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-linux-aarch64
          key: package-linux-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-windows-x86_64
          key: package-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-android
          key: package-android-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: package/package-ios
          key: package-ios-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: |
          mkdir out
          cp package/*/* out/
          (cd out && sha256sum SalamCalculator-* >SHA256SUMS)
          sed "s/@VERSION@/$VERSION/g" .github/release-notes.md >notes.md
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag \
            --title "Salam Calculator $VERSION" --notes-file notes.md
